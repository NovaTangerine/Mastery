<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
    <script>
      // Suppress benign ResizeObserver errors
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('ResizeObserver loop completed with undelivered notifications') || e.message.includes('ResizeObserver loop limit exceeded'))) {
          e.stopImmediatePropagation();
        }
      });
      window.onerror = function(message) {
        document.getElementById("error-log").innerHTML += message + "<br>";
        if (typeof message === 'string' && (message.includes('ResizeObserver loop completed with undelivered notifications') || message.includes('ResizeObserver loop limit exceeded'))) {
          return true; // Suppress the error
        }
      };
      
      // Prevent the error at the source by wrapping callbacks in requestAnimationFrame
      const _ResizeObserver = window.ResizeObserver;
      window.ResizeObserver = class ResizeObserver extends _ResizeObserver {
        constructor(callback) {
          super((entries, observer) => {
            window.requestAnimationFrame(() => {
              callback(entries, observer);
            });
          });
        }
      };
    </script>
  </head>
  <body style="background-color: #09090b; color: #f4f4f5;">
    <div id="error-log" style="color:red; background:white; position:fixed; z-index:9999;"></div><div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
